<!DOCTYPE html>
<html lang="en">

<style type="text/css">
  h1 {
	  font-family: Arial, Helvetica, sans-serif;
	  color: #F00;
	  font-size: x-large;
  }
  p {
	  font-family: Arial, Helvetica, sans-serif;
	  color: #000;
	  font-size: small;
  }
  html, body {
      background-color: #000;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
  }
  body {
      text-align: center;
      touch-action: manipulation;
      overscroll-behavior: none;
  }
  #gameContainer {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      -webkit-user-select: none;
      user-select: none;
      text-align: left;
      background: #000;
  }
  #MMFCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      background: #000;
  }
  #bloctxt {
	  border-left-width: 5px;
	  border-left-style: solid;
	  border-left-color: #F00;
	  padding-left: 10px;
	  position: absolute;
	  left: 50%%;
	  width: 600px;
	  margin-left: -260px
  }
</style>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, target-densitydpi=device-dpi" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="HandheldFriendly" content="true" />
  <title>Five Nights at Christis v0.1</title>
  <script>
    if (!document.createElement("canvas").getContext)
    {
      window.open("http://www.clickteam.com/html5-fallback", "_self");
    }
  </script>
  <script src="src/Runtime.js"></script>
</head>
<body>
<div id="gameContainer">
    <canvas id="MMFCanvas" width="1280" height="720">
      Your browser does not support Canvas.
    </canvas>
</div>
<script>
  function requestFullscreen() {
      var docEl = document.documentElement;
      var request = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
      if (request && !document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
          try {
              request.call(docEl);
          } catch (e) {
          }
      }
  }

  function enableMobileFullscreen() {
      var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
      if (!isMobile) {
          return;
      }

      var triggerFullscreen = function() {
          requestFullscreen();
      };

      ["touchstart", "pointerdown", "click"].forEach(function(eventName) {
          window.addEventListener(eventName, triggerFullscreen, { passive: true, once: true });
      });
  }

  window.addEventListener("load", windowLoaded, false);
  function windowLoaded()
  {
      document.title = "Five Nights at Christis v0.1 - Beniamin Nitu";
      enableMobileFullscreen();
      new Runtime("MMFCanvas", "resources/FNAF1HTML5.cch");
  }
</script>
</body>
</html>
